<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Splitter</title>
</head>
<body>
    <main>
        <h1>Tip Splitter</h1>
        <label for="bill">Bill amount (kr)</label>
        <input id="bill" type="number" min="0" step="0.01">
        <label for="people">people</label>
        <input id="people" type="number" min="0" step="0">
        <button type="button" class="">10%</button>
        <button type="button" class="">15%</button>
        <button type="button" class="">20%</button>
    </main>
</body>
</html>
