<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Splitter</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <main>
        <section>
        <h1>Tip Splitter</h1>
        <label for="bill">Bill amount (kr)</label>
        <input id="bill" type="number" min="0" step="0.01">
        <label for="people">people</label>
        <input id="people" type="number" min="1" step="1">
        <button type="button" class="tip-button">10%</button>
        <button type="button" class="tip-button">15%</button>
        <button type="button" class="tip-button">20%</button>
        </section>

        <section>
            <p>Dricks: <span id="tip-amount">0.00 kr</span></p>
            <p>Total nota: <span id="total-amount">0.00 kr</span></p>
            <p>Per person: <span id="per-person">0.00 kr</span></p>
        </section>
        
    </main>
</body>
</html>
